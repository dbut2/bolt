name: Bot rankings

on:
  workflow_dispatch:
  workflow_call:

concurrency: rankings

permissions:
  contents: write

jobs:
  rankings:
    runs-on: ubuntu-latest
    steps:
      - id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_CLIENT_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go run ./cmd/rankings -readme README.md

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.generate-token.outputs.token }}
          branch: rankings
          delete-branch: true
          labels: automerge
          add-paths: README.md
          commit-message: 'readme: refresh rankings table'
          title: 'readme: refresh rankings table'
          body: beep boop beep boop, I've refreshed the rankings table
          author: dylan-botler[bot] <dylan-botler[bot]@users.noreply.github.com>
          committer: dylan-botler[bot] <dylan-botler[bot]@users.noreply.github.com>
